name: Update sitemap

on:
  push:
    branches: [main]
    paths:
      - "*.html"
      - "scripts/generate-sitemap.mjs"
      - ".github/workflows/update-sitemap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sitemap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate sitemap
        run: npm run generate:sitemap

      - name: Commit sitemap when changed
        run: |
          if git diff --quiet -- sitemap.xml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "sitemap.xmlを自動更新"
          git push
